name: Release

on:
  push:
    tags:
      - 'v0.1.[0-9]+'

permissions:
  contents: read

# release/0.1.x maintenance branch: crates.io only. npm, PyPI, the Go SDK wasm
# commit to main and the GitHub "Latest" release belong to the current line on
# main; publishing a 0.1.x patch there would overwrite or outrank it.
jobs:
  # ── crates.io (polyhook-core + polyhook) ────────────────────────────────────
  # Required secret: CRATES_IO_TOKEN
  # Note: sdk-rust uses a path dep on polyhook-core; we publish core first,
  # wait for indexing, then patch the dep and publish the SDK.
  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" core/Cargo.toml
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" packages/sdk-rust/Cargo.toml
          sed -i "s|polyhook-core = { path = \"../../core\" }|polyhook-core = { version = \"$VERSION\" }|" \
            packages/sdk-rust/Cargo.toml
      - name: Publish polyhook-core
        run: cargo publish -p polyhook-core --token ${{ secrets.CRATES_IO_TOKEN }} --allow-dirty
      - name: Publish polyhook (sdk-rust)
        run: |
          for i in 1 2 3 4 5; do
            cargo publish -p polyhook --token ${{ secrets.CRATES_IO_TOKEN }} --allow-dirty && exit 0
            echo "Attempt $i failed — waiting 30s for polyhook-core to index…"
            sleep 30
          done
          exit 1

