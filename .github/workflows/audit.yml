name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "core/Cargo.toml"
      - "packages/sdk-rust/Cargo.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "core/Cargo.toml"
      - "packages/sdk-rust/Cargo.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Cargo.lock is gitignored (this is a published library, not a binary),
      # so resolve dependencies fresh before auditing them.
      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Audit dependencies
        run: cargo audit
