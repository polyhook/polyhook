[workspace]
members = [
    "core",
    "packages/sdk-rust",
]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
# Prefer passing a method path (e.g. `str::to_owned`) over a closure that only
# forwards its argument to a method call (e.g. `|s| s.to_owned()`).
redundant_closure_for_method_calls = "deny"
all = { level = "deny", priority = -1 }
# Require an explicit trailing `;` on unit-returning statements so a block's
# final expression unambiguously signals whether it yields a value.
semicolon_if_nothing_returned = "deny"
# Small `Copy` types (e.g. the 1-byte `CallerKind` enum) are cheaper and
# clearer to pass by value than by reference. See PR enabling this lint.
trivially_copy_pass_by_ref = "warn"
# Use `pointer::cast_const` / `pointer::cast_mut` instead of an `as` cast when
# the only change is the pointer's constness, so genuine type-changing casts in
# the WASM FFI layer stand out from mere const/mut adjustments.
ptr_cast_constness = "deny"
